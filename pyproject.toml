[project]
name = "ext-tool"
version = "0.1.0"
description = "Manage VS Code / Cursor extensions from a single source-of-truth TOML registry."
authors = [{ name = "Joe Black", email = "me@joeblack.nyc" }]
readme = "README.md"
license = { text = "MIT" }
keywords = ["vscode", "cursor", "extensions", "cli", "developer-tools"]
requires-python = ">=3.12,<4.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "tomli-w>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.urls]
"Bug Tracker" = "https://github.com/joeblackwaslike/ext-tool/issues"
Documentation = "https://joeblackwaslike.github.io/ext-tool/"
Homepage = "https://github.com/joeblackwaslike/ext-tool"
Repository = "https://github.com/joeblackwaslike/ext-tool"

[project.scripts]
ext = "ext_tool.cli:app"

[dependency-groups]
dev = [
    "mkdocs~=1.6.1",
    "mkdocs-material~=9.6.21",
    "mkdocstrings[python]~=0.30.1",
    "pytest>=8.1",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",          # mock httpx in tests
    "ruff>=0.9",
    "mypy>=1.13",
    "pre-commit>=3.7",
    "wemake-python-styleguide~=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ext_tool"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
skip_empty = true

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
files = ["src"]
plugins = ["pydantic.mypy"]
strict = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "ext_tool.config"
# pydantic-settings BaseSettings subclasses Any at the mypy level
ignore_errors = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# typer command callbacks use untyped @app.callback / @app.command decorators
module = [
    "ext_tool.cli",
    "ext_tool.commands.generate",
    "ext_tool.commands.install",
    "ext_tool.commands.update",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# pytest and respx decorators (@pytest.fixture, @respx.mock) are untyped
module = ["tests.*", "conftest"]
disallow_untyped_decorators = false
disallow_untyped_defs = false

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # maccabe
    "COM",  # flake8-commas
    "D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle
    "ERA",  # flake8-eradicate
    "EXE",  # flake8-executable
    "F",    # pyflakes
    "FBT",  # flake8-boolean-trap
    "FLY",  # pyflint
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff
    "S",    # flake8-bandit
    "SIM",  # flake8-simpify
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "T100", # flake8-debugger
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
    "YTT",  # flake8-2020
]
ignore = [
    "A005",   # allow to shadow stdlib and builtin module names
    "COM812", # trailing comma, conflicts with `ruff format`
    # Different doc rules that we don't really care about:
    "D100",
    "D104",
    "D106",
    "D203",
    "D212",
    "D401",
    "D404",
    "D405",
    "E501",    # line too long
    "E731",    # do not assign lambda
    "ISC001",  # implicit string concat conflicts with `ruff format`
    "ISC003",  # prefer explicit string concat over implicit concat
    "PLR09",   # we have our own complexity rules
    "PLR2004", # do not report magic numbers
    "PLR6301", # do not require classmethod / staticmethod when self not used
    "TRY003",  # long exception messages from `tryceratops`
]
external = ["WPS"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "S101",
    "S105",
    "S404",
    "S603",
    "S607",
    "D103",
    "FBT001",
]
"src/ext_tool/marketplace.py" = [
    "S603",  # subprocess with variable args — required for CLI helper dispatch
    "S607",  # partial executable path — required for CLI helper dispatch
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
