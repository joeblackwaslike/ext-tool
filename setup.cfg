# All configuration for plugins
# and other utils is defined here and in `pyproject.toml`

# === Linter configuration ===
# You can reuse this configuration in your own projects.


# NOTE: You can use https://pypi.org/project/Flake8-pyproject/
# to move all your `flake8` configuration to `pyproject.toml`

[flake8]
# Base flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true
show-violation-links = true

# Self settings:
max-imports = 17
max-module-members = 20
max-expressions = 15
max-local-variables = 7
max-jones-complexity = 16
max-function-complexity = 15
max-name-length = 50

# Excluding some directories:
extend-exclude =
  .venv

# We only run `wemake-python-styleguide` with `flake8`:
select = WPS, E999

per-file-ignores =
  # There are multiple fixtures, `assert`s, and subprocesses in tests:
  tests/*.py: WPS202, WPS211, WPS226, WPS110
  src/ext_tool/__init__.py: WPS412, WPS420
  tests/conftest.py: WPS411, WPS412
  # subprocess with variable args is intentional (CLI helper dispatch):
  src/ext_tool/marketplace.py: S603, S607